version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: earcraft_db
    environment:
      POSTGRES_DB: earcraft_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: earcraft_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  redis:
    image: redis:7-alpine
    container_name: earcraft_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: earcraft_backend
    command: gunicorn --config /app/docker/Gunicorn.conf.py earcraft.wsgi:application
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgres://postgres:earcraft_secure_password_2026@db:5432/earcraft_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: earcraft_celery
    command: celery -A earcraft worker -l info
    depends_on:
      - backend
      - redis

  nginx:
    image: nginx:alpine
    container_name: earcraft_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
